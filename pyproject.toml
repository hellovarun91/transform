[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "transform"
version = "1.0.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["transform*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
